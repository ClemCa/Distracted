spring:
  config:
    import: optional:file:.env
  application:
    name: distracted
  datasource:
    url: jdbc:sqlite:distracted.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP

server:
  port: 8081

clemsso:
  client-id: ${CLEMSSO_CLIENT_ID:}
  client-secret: ${CLEMSSO_CLIENT_SECRET:}
